apiVersion: eigen.os/v1
kind: QuantumJob
metadata:
  name: qft-16q
  labels:
    example: "true"
    domain: quantum-algorithms
    algorithm: qft
spec:
  program:
    path: program.eigen.py
    entrypoint: main
  target: sim:local
  priority: 60
  workload:
    kind: BenchmarkJob
    execution_profile: benchmark
    replayable: false
    backend_target: sim:local
    seed: 42
  metadata:
    shots: "16384"
    optimizer: "none"
    algorithm: "qft"
    n: "16"
    seed: "42"
    