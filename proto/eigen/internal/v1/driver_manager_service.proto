syntax = "proto3";

package eigen.internal.v1;

import "eigen/internal/v1/types.proto";

option go_package = "github.com/eigen-os/eigen/api/internal/v1;internalv1";
option java_multiple_files = true;
option java_outer_classname = "DriverManagerServiceProto";
option java_package = "com.eigen.api.internal.v1";

// Kernel-facing driver manager contract.
// Source of truth: RFC 0006.
service DriverManagerService {
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  rpc GetDeviceStatus(GetDeviceStatusRequest) returns (GetDeviceStatusResponse);
  rpc ExecuteCircuit(ExecuteCircuitRequest) returns (ExecuteCircuitResponse);
  rpc CalibrateDevice(CalibrateDeviceRequest) returns (CalibrateDeviceResponse);
}

message ListDevicesRequest {}

message ListDevicesResponse {
  repeated DeviceInfo devices = 1;
}

message DeviceStatusRequest {
  string device_id = 1;
}

message DeviceStatusResponse {
  string device_id = 1;
  DeviceStatus status = 2;
  int32 queue_depth = 3;
  int32 estimated_wait_sec = 4;
  map<string, string> metadata = 5;
}

message ObservableTerm {
  // Stable caller-supplied identifier returned in ExecuteCircuitResponse.expectations.
  string term_id = 1;
  // Pauli product, for example "Z" or "XZ". Its length must match qubits.
  string operator = 2;
  repeated uint32 qubits = 3;
  double coefficient = 4;
}

message ObservableMeasurementPlan {
  // Terms are evaluated by the selected backend; all requested terms are mandatory.
  repeated ObservableTerm terms = 1;
  // Required measurement basis family, currently PAULI for Pauli-product terms.
  string measurement_basis = 2;
}

message ExecuteCircuitRequest {
  string job_id = 1;
  string device_id = 2;
  CircuitPayload payload = 3;
  int32 shots = 4;
  map<string, string> options = 5;
  // Additive bound values applied to symbolic AQO parameters for this execution.
  map<string, double> parameter_bindings = 6;
  // Optional observable request. A backend must reject unsupported plans.
  ObservableMeasurementPlan observable_measurement_plan = 7;
  // Optional canonical model identifier, e.g. "depolarizing:0.001".
  string noise_model = 8;
}

message ExecuteCircuitResponse {
  map<string, int64> counts = 1;
  double execution_time_sec = 2;
  map<string, string> metadata = 3;
  // Term expectations keyed by ObservableTerm.term_id, including each coefficient.
  map<string, double> expectations = 4;
}

message CalibrateDeviceRequest {
  string device_id = 1;
  map<string, string> options = 2;
}

message CalibrateDeviceResponse {
  // For MVP this is just a reference to the stored calibration artifact.
  string calibration_ref = 1;
}