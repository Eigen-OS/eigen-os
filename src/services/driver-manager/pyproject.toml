[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "driver-manager"
version = "0.8.0"
description = "Eigen OS driver-manager service (MVP skeleton)."
requires-python = ">=3.12"
dependencies = [
  "grpcio>=1.80",
  "grpcio-tools>=1.80",
  "grpcio-status>=1.80",
  "googleapis-common-protos>=1.74",
  "protobuf>=6.31.1,<7.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9",
]
pennylane = [
  "pennylane>=0.45,<0.46",
]

[project.scripts]
driver-manager = "driver_manager.main:main"

[project.entry-points."eigen_os.driver_plugins"]
aqo-simulator = "driver_manager.simulator_driver:create_plugin"
qiskit-runtime = "driver_manager.qiskit_runtime_driver:create_plugin"
aws-braket = "driver_manager.aws_braket_driver:create_plugin"
pennylane = "driver_manager.pennylane_driver:create_plugin"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
